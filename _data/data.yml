    intro: |
      I was first (or shared-first) author of the following publications:
    papers:
      - title: "How Do You Perceive My Face? Recognizing Facial Expressions in Multi-Modal Context by Modeling Mental Representations"
        link: "https://arxiv.org/abs/2409.02566"
        authors: Florian Blume, Runfeng Qu, Pia Bideau, Martin Maier, Rasha Abdel Rahman, Olaf Hellwich
        conference: "Accepted to GCPR 2024"

      - title: "Multi-Task Multi-Modal Self-Supervised Learning for Facial Expression Recognition"
